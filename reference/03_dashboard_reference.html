<!DOCTYPE html>
<html lang="en">
<head>
<title>AI IELTS Coach | Student Dashboard</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --brand-50:#eff6ff; --brand-100:#dbeafe; --brand-400:#60a5fa; --brand-500:#3b82f6; --brand-600:#2563eb; --brand-700:#1d4ed8;
  --ai-50:#faf5ff; --ai-100:#f3e8ff; --ai-500:#a855f7; --ai-600:#9333ea; --ai-700:#7e22ce;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8;
  --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;
  --emerald-50:#ecfdf5; --emerald-100:#d1fae5; --emerald-500:#10b981; --emerald-600:#059669; --emerald-700:#047857;
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-500:#f59e0b; --amber-600:#d97706; --amber-700:#b45309;
  --rose-50:#fff1f2; --rose-100:#ffe4e6; --rose-500:#f43f5e; --rose-600:#e11d48;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04); --shadow-md:0 10px 30px rgba(15,23,42,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--slate-800);background:var(--slate-50)}
body{line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{text-decoration:none;color:inherit}
::selection{background:#dbeafe;color:#1e3a8a}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:3px solid rgba(59,130,246,.28);outline-offset:2px}
.container{width:min(1120px,calc(100% - 40px));margin:0 auto}
.card{background:#fff;border:1px solid var(--slate-100);border-radius:18px;box-shadow:var(--shadow-sm)}
.muted{color:var(--slate-500)}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--slate-400)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s ease}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.18)}
.btn-primary:hover{background:var(--brand-700);transform:translateY(-1px)}
.btn-secondary{background:#fff;border:1px solid var(--slate-200);color:var(--slate-700)}
.btn-secondary:hover{background:var(--slate-50)}
.btn-ai{background:var(--ai-600);color:#fff}
.btn-ai:hover{background:var(--ai-700)}
.btn-danger{background:#fff;border:1px solid var(--rose-100);color:var(--rose-600)}
.btn-ghost{background:transparent;color:var(--slate-600)}
.btn-ghost:hover{background:var(--slate-100)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:700;color:var(--slate-700)}
.input,.select,.textarea{width:100%;border:1px solid var(--slate-200);border-radius:12px;padding:12px 13px;background:#fff;color:var(--slate-800);transition:.18s}
.input:focus,.select:focus,.textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(59,130,246,.10);outline:none}
.textarea{min-height:180px;resize:vertical}
.error{font-size:12px;color:var(--rose-600);display:none}
.error.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--slate-200);border-radius:14px;background:#fff;cursor:pointer;transition:.18s}
.choice label:hover{border-color:#bfdbfe;background:#f8fbff}
.choice input:checked+label{border-color:#60a5fa;background:var(--brand-50);box-shadow:inset 0 0 0 1px #60a5fa}
.choice .choice-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--slate-100);color:var(--slate-500)}
.choice input:checked+label .choice-icon{background:#dbeafe;color:var(--brand-700)}
.progress-line{height:7px;background:var(--slate-100);border-radius:999px;overflow:hidden}
.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-500),var(--ai-600));border-radius:999px;transition:.25s}
.notice{padding:12px 14px;border-radius:12px;border:1px solid #dbeafe;background:var(--brand-50);color:#1e40af;font-size:13px}
.fade{animation:fade .24s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(4px);z-index:100;display:none;padding:20px;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(15,23,42,.25);padding:24px}
.toast{position:fixed;right:20px;bottom:20px;z-index:120;display:none;max-width:380px;padding:12px 15px;border-radius:12px;background:var(--slate-900);color:#fff;font-size:13px;box-shadow:0 15px 40px rgba(15,23,42,.25)}
.toast.show{display:block;animation:fade .2s ease}
.small{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge-blue{background:var(--brand-50);color:var(--brand-700)}
.badge-ai{background:var(--ai-50);color:var(--ai-700)}
.badge-green{background:var(--emerald-50);color:var(--emerald-700)}
.badge-amber{background:var(--amber-50);color:var(--amber-700)}
.badge-gray{background:var(--slate-100);color:var(--slate-600)}
@media(max-width:720px){
  .container{width:min(100% - 24px,1120px)}
  .choice-grid{grid-template-columns:1fr}
}
</style>

<style>
body{background:var(--slate-50);height:100vh;overflow:hidden}
.app{height:100vh;display:flex}
.sidebar{width:256px;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;flex:none}
.logo-area{height:66px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--slate-100)}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-500),var(--ai-600));color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(37,99,235,.16)}
.side-nav{padding:16px 10px;overflow:auto;flex:1}
.nav-group{margin-bottom:21px}.nav-title{padding:0 11px;margin-bottom:7px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--slate-400)}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--slate-600);font-weight:600;font-size:13px;transition:.16s;cursor:pointer}
.nav-link:hover{background:var(--slate-50);color:var(--slate-900)}.nav-link.active{background:var(--brand-50);color:var(--brand-700)}.nav-link i{width:18px;text-align:center;color:var(--slate-400)}.nav-link.active i{color:var(--brand-600)}
.main-area{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 24px;background:#fff;border-bottom:1px solid var(--slate-200);z-index:30}
.left-top{display:flex;align-items:center;gap:14px;min-width:0}.mobile-menu{display:none}
.search{width:280px;background:var(--slate-100);border-radius:9px;padding:9px 11px;display:flex;gap:8px;align-items:center}.search i{color:var(--slate-400)}.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.top-actions{display:flex;align-items:center;gap:12px}.icon-btn{width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--slate-500);position:relative}.icon-btn:hover{background:var(--slate-100)}
.dot{position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--brand-500);border:2px solid #fff;border-radius:50%}
.profile-btn{display:flex;align-items:center;gap:9px;border:0;background:transparent}.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-600);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}.profile-meta{text-align:right}.profile-meta strong{font-size:13px}.profile-meta span{display:block;font-size:10px;color:var(--slate-500)}
.main-scroll{flex:1;overflow:auto;padding:24px 22px 60px}
.content{width:min(1180px,100%);margin:auto}.greeting{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.greeting h1{font-size:24px;line-height:1.15;margin:0 0 6px;letter-spacing:-.025em}.greeting p{margin:0;font-size:13px;color:var(--slate-500)}
.state-banner{border-radius:18px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--brand-600),var(--ai-600));position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(37,99,235,.15)}.state-banner:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-55px;top:-80px;background:rgba(255,255,255,.10);filter:blur(3px)}.state-banner>div{position:relative;z-index:1}
.state-banner h2{font-size:25px;margin:6px 0 8px}.state-banner p{font-size:13px;line-height:1.7;max-width:760px;margin:0 0 16px;color:#e0ecff}
.banner-chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 22px}.banner-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);padding:6px 9px;border-radius:9px;font-size:11px;font-weight:700}
.banner-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-white{background:#fff;color:var(--brand-700)}.btn-white:hover{background:#eff6ff}.btn-outline-white{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}.btn-outline-white:hover{background:rgba(255,255,255,.08)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.profile-card{padding:20px}.profile-row{padding:11px 0;border-bottom:1px solid var(--slate-100)}.profile-row:last-child{border-bottom:0}.profile-row .label{font-size:10px;color:var(--slate-400);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.profile-row .value{font-size:13px;font-weight:700;color:var(--slate-700);margin-top:3px}
.locked{position:relative;min-height:190px;overflow:hidden}.locked:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(2px)}.locked-content{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;padding:20px}.locked-content i{font-size:26px;color:var(--slate-300)}.locked-content strong{display:block;font-size:13px;color:var(--slate-600);margin-top:7px}.feature{padding:20px;text-align:center}.feature i{font-size:29px;margin-bottom:10px}.feature h3{margin:0;font-size:15px}.feature p{font-size:11px;color:var(--slate-400);margin:5px 0 0}
.info-strip{margin-top:16px;padding:12px 14px;background:var(--brand-50);border:1px solid var(--brand-100);border-radius:11px;color:#1e40af;font-size:12px;font-weight:600;display:flex;align-items:center;gap:9px}
.incomplete-card{padding:20px;margin-bottom:16px;border-left:4px solid var(--amber-500)}.incomplete-layout{display:grid;grid-template-columns:1fr 330px;gap:20px}.warning-tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--amber-50);border:1px solid var(--amber-100);color:var(--amber-700);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.checklist{background:var(--slate-50);border:1px solid var(--slate-100);border-radius:14px;padding:15px}.checklist-head{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:800}.check-item{display:flex;justify-content:space-between;padding:8px 0;font-size:12px}.check-ok{color:var(--emerald-700);font-weight:700}.check-pending{color:var(--slate-400)}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card-pad{padding:20px}.section-title{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.metric-card{padding:17px;position:relative;overflow:hidden}.metric-card .bubble{position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:var(--brand-50)}.metric-value{font-size:28px;font-weight:800;margin-top:4px}.metric-sub{font-size:11px;color:var(--slate-400);margin-top:4px}
.module-card{padding:15px;background:var(--slate-50);border:1px solid var(--slate-100);border-radius:13px;cursor:pointer}.module-card:hover{background:#fff;border-color:#bfdbfe;box-shadow:0 8px 20px rgba(15,23,42,.05)}.module-top{display:flex;justify-content:space-between;align-items:end;gap:8px}.module-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px}.module-name i{width:25px;height:25px;border-radius:7px;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center}.module-score{font-size:14px;font-weight:800}.bar{height:6px;background:var(--slate-200);border-radius:999px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-500),var(--ai-500));border-radius:999px}
.plan-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border:1px solid var(--slate-100);border-radius:11px;background:var(--slate-50);margin-bottom:8px}.plan-main{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}.plan-icon{width:29px;height:29px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--slate-500);box-shadow:var(--shadow-sm)}.plan-time{font-size:11px;color:var(--slate-500);font-weight:700}
.priority{background:var(--rose-50);border:1px solid var(--rose-100)}.ai-card{background:linear-gradient(135deg,var(--ai-600),var(--ai-700));padding:4px;border-radius:18px}.ai-inner{background:#fff;border-radius:14px;padding:18px}.ai-msg{background:var(--ai-50);border:1px solid var(--ai-100);border-radius:11px;padding:13px;font-size:12px;line-height:1.7;margin:12px 0}
.streak{text-align:center}.streak-num{font-size:42px;font-weight:900}.days{display:flex;gap:6px;justify-content:center;margin-top:10px}.day{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--amber-100);color:var(--amber-700);border:1px solid var(--amber-100)}.day.off{background:#fff;border-style:dashed;color:var(--slate-400);border-color:var(--slate-200)}
.gauge{height:100px;display:flex;justify-content:center;position:relative;overflow:hidden}.gauge-base{position:absolute;bottom:0;width:180px;height:90px;border-radius:180px 180px 0 0;background:var(--slate-100)}.gauge-fill{position:absolute;bottom:0;width:180px;height:90px;border-radius:180px 180px 0 0;background:linear-gradient(90deg,#fb7185,#fbbf24,#34d399);clip-path:polygon(0 0,55% 0,50% 100%,0 100%)}.gauge-inner{position:absolute;bottom:0;width:132px;height:66px;border-radius:132px 132px 0 0;background:#fff}.gauge-needle{position:absolute;bottom:0;width:4px;height:70px;background:var(--slate-800);border-radius:999px;transform-origin:50% 100%;transform:rotate(-10deg)}.gauge-dot{position:absolute;bottom:-2px;width:13px;height:13px;background:var(--slate-800);border-radius:50%}
.dropdown{position:absolute;right:0;top:48px;width:235px;background:#fff;border:1px solid var(--slate-100);box-shadow:0 14px 40px rgba(15,23,42,.12);border-radius:14px;overflow:hidden;display:none;z-index:70}.dropdown.show{display:block}.drop-head{padding:13px;border-bottom:1px solid var(--slate-100);font-size:12px;font-weight:800}.drop-item{padding:10px 13px;font-size:12px;color:var(--slate-700);display:flex;gap:8px;align-items:center;cursor:pointer}.drop-item:hover{background:var(--slate-50)}
.empty-card{text-align:center;padding:50px 20px}.empty-card h2{font-size:18px;margin:12px 0 6px}.empty-card p{font-size:13px;color:var(--slate-500);max-width:500px;margin:0 auto 17px}
.footer-note{font-size:10px;color:var(--slate-400);text-align:center;margin-top:26px}
.mobile-overlay{display:none}
@media(max-width:1050px){.sidebar{width:228px}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.incomplete-layout{grid-template-columns:1fr}}
@media(max-width:820px){.sidebar{position:fixed;top:0;bottom:0;left:0;z-index:60;transform:translateX(-102%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50}.mobile-menu{display:grid}.search{display:none}.main-scroll{padding:18px 12px 50px}.topbar{padding:0 12px}.profile-meta{display:none}.greeting{align-items:flex-start;flex-direction:column}.grid3,.split2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid4{grid-template-columns:1fr 1fr}.state-banner{padding:19px}.state-banner h2{font-size:21px}.banner-actions .btn{width:100%}.module-grid{grid-template-columns:1fr}.footer-note{margin-bottom:20px}}
</style>
</head>
<body>
<div class="app">
  <div id="mobileOverlay" class="mobile-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar">
    <div class="logo-area"><div class="brand"><div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div><span>AI IELTS Coach</span></div></div>
    <nav class="side-nav">
      <div class="nav-group"><div class="nav-title">Home</div><div class="nav-link active" onclick="home()"><i class="fa-solid fa-house"></i> Home</div></div>
      <div class="nav-group"><div class="nav-title">Study</div><div class="nav-link" onclick="openModule('Learn')"><i class="fa-solid fa-book-open"></i> Learn</div><div class="nav-link" onclick="openModule('Practice')"><i class="fa-solid fa-dumbbell"></i> Practice</div></div>
      <div class="nav-group"><div class="nav-title">IELTS</div><div class="nav-link" onclick="openModule('Exam')"><i class="fa-solid fa-file-signature"></i> Exam <span id="examLock" style="margin-left:auto;font-size:10px;color:var(--slate-300)"><i class="fa-solid fa-lock"></i></span></div>
        <div class="nav-link" onclick="openModule('Reading')"><i class="fa-solid fa-book-reader"></i> Reading</div><div class="nav-link" onclick="openModule('Writing')"><i class="fa-solid fa-pen-nib"></i> Writing</div><div class="nav-link" onclick="openModule('Listening')"><i class="fa-solid fa-headphones"></i> Listening</div><div class="nav-link" onclick="openModule('Speaking')"><i class="fa-solid fa-microphone"></i> Speaking</div></div>
      <div class="nav-group"><div class="nav-title">Language</div><div class="nav-link" onclick="openModule('Vocabulary')"><i class="fa-solid fa-spell-check"></i> Vocabulary</div><div class="nav-link" onclick="openModule('Grammar')"><i class="fa-solid fa-diagram-project"></i> Grammar</div><div class="nav-link" onclick="openModule('Pronunciation')"><i class="fa-solid fa-comment-dots"></i> Pronunciation</div></div>
      <div class="nav-group"><div class="nav-title">Track</div><div class="nav-link" onclick="openModule('Progress')"><i class="fa-solid fa-chart-line"></i> Progress</div><div class="nav-link" onclick="openModule('My Mistakes')"><i class="fa-solid fa-triangle-exclamation"></i> My Mistakes</div><div class="nav-link" onclick="openModule('Saved Content')"><i class="fa-solid fa-bookmark"></i> Saved Content</div></div>
      <div class="nav-group"><div class="nav-title">Account</div><div class="nav-link" onclick="openProfile()"><i class="fa-solid fa-user"></i> Profile</div><div class="nav-link" onclick="openModule('Settings')"><i class="fa-solid fa-gear"></i> Settings</div><div class="nav-link" onclick="openModule('Help')"><i class="fa-regular fa-circle-question"></i> Help</div></div>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="left-top"><button class="icon-btn mobile-menu" onclick="toggleSidebar()" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="Search lessons, topics..." aria-label="Search"></div></div>
      <div class="top-actions">
        <div style="position:relative"><button class="icon-btn" onclick="toggleDrop('notifDrop')" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span id="notifDot" class="dot"></span></button><div id="notifDrop" class="dropdown"><div class="drop-head">Notifications</div><div id="notifBody" class="drop-item" style="align-items:flex-start">Loading…</div></div></div>
        <div style="position:relative"><button class="profile-btn" onclick="toggleDrop('profileDrop')"><div class="profile-meta"><strong id="profileNameTop">Student</strong><span>Student</span></div><div class="avatar" id="avatar">S</div><i class="fa-solid fa-chevron-down" style="font-size:10px;color:var(--slate-400)"></i></button><div id="profileDrop" class="dropdown"><div class="drop-head" id="profileDropName">Student</div><div class="drop-item" onclick="openProfile()"><i class="fa-regular fa-user"></i> Edit profile</div><div class="drop-item" onclick="openModule('Settings')"><i class="fa-solid fa-gear"></i> Settings</div><div class="drop-item" onclick="resetDemo()"><i class="fa-solid fa-rotate-left"></i> Reset demo data</div></div></div>
      </div>
    </header>

<script>
const STORAGE = {
  root:'aiIELTSCoach',
  user:'ai_ielts_user_profile',
  onboarding:'ai_ielts_onboarding_state',
  diagnostic:'ai_ielts_diagnostic_state',
  results:'ai_ielts_results'
};
const DEFAULT_STATE = {
  version:1,
  user:{firstName:'',ageGroup:'',studyContext:'',occupation:''},
  onboarding:{
    status:'in_progress', step:0,
    goal:{testType:'',targetBand:'',examDate:'',reason:''},
    language:{englishVariant:'',explanationLanguage:''},
    selfAssessment:'',
    study:{dailyMinutes:'',sessionLength:'',intensity:''}
  },
  diagnostic:{
    status:'not_started', currentSection:0, currentQuestion:0,
    responses:{}, completedSections:[], writingText:'',
    speaking:{status:'READY',duration:0,hasRecording:false,recordingSavedAt:null},
    startedAt:null, completedAt:null
  },
  results:null,
  ui:{}
};
function deepClone(x){return JSON.parse(JSON.stringify(x));}
function loadState(){
  let s=deepClone(DEFAULT_STATE);
  try{
    const root=JSON.parse(localStorage.getItem(STORAGE.root)||'null');
    if(root && typeof root==='object') s={...s,...root,user:{...s.user,...(root.user||{})},onboarding:{...s.onboarding,...(root.onboarding||{}),goal:{...s.onboarding.goal,...((root.onboarding||{}).goal||{})},language:{...s.onboarding.language,...((root.onboarding||{}).language||{})},study:{...s.onboarding.study,...((root.onboarding||{}).study||{})}},diagnostic:{...s.diagnostic,...(root.diagnostic||{}),responses:{...s.diagnostic.responses,...((root.diagnostic||{}).responses||{})},speaking:{...s.diagnostic.speaking,...((root.diagnostic||{}).speaking||{})}},results:root.results||null};
    else{
      const u=JSON.parse(localStorage.getItem(STORAGE.user)||'null');
      const o=JSON.parse(localStorage.getItem(STORAGE.onboarding)||'null');
      const d=JSON.parse(localStorage.getItem(STORAGE.diagnostic)||'null');
      const r=JSON.parse(localStorage.getItem(STORAGE.results)||'null');
      if(u) s.user={...s.user,...u};
      if(o) s.onboarding={...s.onboarding,...o};
      if(d) s.diagnostic={...s.diagnostic,...d};
      if(r) s.results=r;
    }
  }catch(e){console.warn('State load failed',e);}
  return s;
}
function saveState(s){
  localStorage.setItem(STORAGE.root,JSON.stringify(s));
  localStorage.setItem(STORAGE.user,JSON.stringify(s.user));
  localStorage.setItem(STORAGE.onboarding,JSON.stringify(s.onboarding));
  localStorage.setItem(STORAGE.diagnostic,JSON.stringify(s.diagnostic));
  if(s.results) localStorage.setItem(STORAGE.results,JSON.stringify(s.results));
  else localStorage.removeItem(STORAGE.results);
}
function setPage(url){window.location.href=url;}
function resetDemo(){if(confirm('Reset all AI IELTS Coach demo data?')){Object.values(STORAGE).forEach(k=>localStorage.removeItem(k));window.location.href='01_onboarding.html';}}
function showToast(msg){const t=document.getElementById('toast'); if(!t)return; t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2600);}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
</script>

<script>
let state=loadState();
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function profileName(){return state.user.firstName||'Student'}
function initials(n){return (n||'S').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function home(){renderDashboard();document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').classList.toggle('show')}
function toggleDrop(id){document.querySelectorAll('.dropdown').forEach(d=>{if(d.id!==id)d.classList.remove('show')});document.getElementById(id).classList.toggle('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.profile-btn')&&!e.target.closest('#profileDrop'))document.getElementById('profileDrop').classList.remove('show');if(!e.target.closest('[aria-label="Notifications"]')&&!e.target.closest('#notifDrop'))document.getElementById('notifDrop').classList.remove('show')})
function fmtDate(d){if(!d)return 'Not set';try{return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function formatTimePref(){return state.onboarding.study.dailyMinutes||'Not set'}
function skillLabel(s){return ({Reading:'Reading',Writing:'Writing',Listening:'Listening',Speaking:'Speaking',Grammar:'Grammar',Vocabulary:'Vocabulary'}[s]||s)}
function percentForBand(b){return Math.round((Number(b)/9)*100)}
function setTop(){
 const n=profileName();document.getElementById('profileNameTop').textContent=n;document.getElementById('profileDropName').textContent=n;document.getElementById('avatar').textContent=initials(n);
 const complete=state.diagnostic.status==='complete';document.getElementById('examLock').style.display=complete?'none':'inline';document.getElementById('notifDot').style.background=complete?'var(--ai-500)':'var(--amber-500)';
 document.getElementById('notifBody').innerHTML=complete?'<span><strong>New AI insight</strong><br><small class="muted">Your coach has updated your starting plan from your diagnostic.</small></span>':'<span><strong>Next step</strong><br><small class="muted">'+(state.onboarding.status!=='complete'?'Finish onboarding to continue.':state.diagnostic.status==='in_progress'?'Your diagnostic is waiting for you.':'Take your diagnostic to unlock deeper personalization.')+'</small></span>';
}
function renderDashboard(){
 state=loadState();setTop();
 const d=document.getElementById('dashboard');
 if(state.onboarding.status!=='complete'){d.innerHTML=renderOnboardingIncomplete();return}
 if(state.diagnostic.status==='complete'&&state.results){d.innerHTML=renderCompleted();return}
 if(state.diagnostic.status==='in_progress'&&state.diagnostic.startedAt){d.innerHTML=renderIncomplete();return}
 d.innerHTML=renderNotStarted();
}
function renderOnboardingIncomplete(){
 return `<div class="greeting"><div><h1>${greeting()}, ${escapeHtml(profileName())} 👋</h1><p>Let’s finish setting up your learning preferences before we assess your English.</p></div></div>
 <div class="empty-card card"><div class="welcome-mark" style="margin:auto;width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand-500),var(--ai-600));color:#fff;display:grid;place-items:center"><i class="fa-solid fa-list-check"></i></div><h2>Your setup is saved.</h2><p>Complete the remaining onboarding questions. You can leave and return without losing your answers.</p><button class="btn btn-primary" onclick="setPage('01_onboarding.html')">Continue onboarding <i class="fa-solid fa-arrow-right"></i></button></div>`
}
function renderNotStarted(){
 const o=state.onboarding,u=state.user;
 return `<div class="greeting"><div><h1>${greeting()}, ${escapeHtml(profileName())} 👋</h1><p>Welcome to your AI IELTS Coach. Let’s understand where you are before deciding where you need to go.</p></div><span class="badge badge-blue"><i class="fa-solid fa-route"></i> Phase 1 · Before diagnostic</span></div>
 <section class="state-banner"><div><span class="badge" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.15)">Priority action</span><h2>Let’s discover your English level.</h2><p>Take a short diagnostic to turn your goals and preferences into a learner-aware starting plan. It includes grammar, vocabulary, reading, writing, listening, speaking and IELTS familiarity.</p><div class="banner-chips">${['Grammar','Vocabulary','Reading','Writing','Listening','Speaking','IELTS Familiarity'].map(x=>`<span class="banner-chip"><i class="fa-solid fa-check" style="color:#a7f3d0"></i> ${x}</span>`).join('')}</div><div class="banner-actions"><button class="btn btn-white" onclick="startDiagnostic()">Start assessment <i class="fa-solid fa-arrow-right"></i></button><button class="btn btn-outline-white" onclick="openModule('Learn')">Learn while you decide</button><span style="font-size:12px;align-self:center;color:#dbeafe"><i class="fa-regular fa-clock"></i> About 20–30 min</span></div></div></section>
 <div class="grid3"><div class="card profile-card"><h3 class="section-title"><i class="fa-regular fa-id-card" style="color:var(--brand-600)"></i> Your Profile</h3><div class="profile-row"><div class="label">Goal</div><div class="value">${escapeHtml(o.goal.testType||'IELTS')} · ${escapeHtml(o.goal.targetBand||'Target not set')}</div></div><div class="profile-row"><div class="label">Target Date</div><div class="value">${fmtDate(o.goal.examDate)}</div></div><div class="profile-row"><div class="label">English Preference</div><div class="value">${o.language.englishVariant==='UK English'?'🇬🇧 ':o.language.englishVariant==='US English'?'🇺🇸 ':''}${escapeHtml(o.language.englishVariant||'Not set')}</div></div><div class="profile-row"><div class="label">Explanation Language</div><div class="value">${escapeHtml(o.language.explanationLanguage||'Not set')}</div></div><button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="openProfile()">Edit Profile</button></div>
 <div class="card locked feature"><div class="locked-content"><div><i class="fa-solid fa-lock"></i><strong>Assessment Required</strong><div class="small muted" style="margin-top:3px">Personalized lessons unlock after assessment</div></div></div><i class="fa-solid fa-brain" style="color:#93c5fd"></i><h3>Smart Learning</h3><p>Personalized lessons based on actual evidence.</p></div>
 <div class="card locked feature"><div class="locked-content"><div><i class="fa-solid fa-lock"></i><strong>Assessment Required</strong><div class="small muted" style="margin-top:3px">IELTS-style practice is limited for now</div></div></div><i class="fa-solid fa-stopwatch" style="color:#86efac"></i><h3>Real Practice</h3><p>Practice matched to your current needs.</p></div></div>
 <div class="info-strip"><i class="fa-solid fa-circle-info"></i><span>Complete your assessment to unlock deeper personalization. No IELTS estimates are shown before we have evidence.</span></div>`
}
function startDiagnostic(){state.diagnostic.status=state.diagnostic.status==='not_started'?'in_progress':state.diagnostic.status;state.diagnostic.startedAt=state.diagnostic.startedAt||new Date().toISOString();saveState();setPage('02_diagnostic.html')}
function renderIncomplete(){
 const completed=state.diagnostic.completedSections||[];const all=['grammar','vocabulary','reading','writing','listening','speaking','familiarity'];const pct=Math.round(completed.length/all.length*100);
 return `<div class="greeting"><div><h1>${greeting()}, ${escapeHtml(profileName())} 👋</h1><p>Finish your assessment to unlock your full personalized learning experience.</p></div><span class="badge badge-amber"><i class="fa-solid fa-circle-exclamation"></i> Phase 2 · Incomplete</span></div>
 <section class="card incomplete-card"><div class="incomplete-layout"><div><span class="warning-tag">Action needed</span><h2 style="font-size:22px;margin:8px 0">Assessment incomplete</h2><p class="muted" style="font-size:13px;max-width:670px">You can leave the assessment and learn in the meantime. Your completed sections are preserved, and the diagnostic will resume from the saved position.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px"><button class="btn btn-primary" onclick="setPage('02_diagnostic.html')">Continue assessment <i class="fa-solid fa-play"></i></button><button class="btn btn-secondary" onclick="openModule('Learn')">Learn while you complete it</button></div></div><div class="checklist"><div class="checklist-head"><span>Assessment progress</span><span>${pct}%</span></div><div class="progress-line" style="margin-bottom:8px"><span style="width:${pct}%"></span></div>${all.map((id,i)=>{const label={'grammar':'Grammar','vocabulary':'Vocabulary','reading':'Reading','writing':'Writing','listening':'Listening','speaking':'Speaking','familiarity':'IELTS Familiarity'}[id];return `<div class="check-item ${completed.includes(id)?'check-ok':'check-pending'}"><span><i class="fa-solid ${completed.includes(id)?'fa-circle-check':'fa-circle'}"></i> ${label}</span><span>${completed.includes(id)?'Completed':'Not started'}</span></div>`}).join('')}</div></div></section>
 <div class="split2"><div class="card card-pad"><h3 class="section-title"><i class="fa-solid fa-unlock" style="color:var(--emerald-600)"></i> What you can do now</h3><div class="plan-item"><div class="plan-main"><div class="plan-icon"><i class="fa-solid fa-book-open"></i></div> General English lessons</div><span class="badge badge-green">Available</span></div><div class="plan-item"><div class="plan-main"><div class="plan-icon"><i class="fa-solid fa-circle-info"></i></div> IELTS information</div><span class="badge badge-green">Available</span></div><div class="plan-item"><div class="plan-main"><div class="plan-icon"><i class="fa-solid fa-dumbbell"></i></div> Limited practice</div><span class="badge badge-amber">Limited</span></div></div><div class="card card-pad"><h3 class="section-title"><i class="fa-solid fa-lock"></i> Personalization waits for evidence</h3><p class="muted" style="font-size:13px;line-height:1.7;margin:0">No provisional IELTS or CEFR estimates are shown yet. That is intentional. Human beings already have enough inaccurate numbers thrown at them.</p><div class="notice" style="margin-top:13px">Finish the remaining sections and we’ll build your initial learner profile.</div></div></div>`
}
function renderCompleted(){
 const r=state.results,o=state.onboarding;const target=Number(o.goal.targetBand||7), priority=r.plan.priority;const overallPct=Math.min(100,r.overall/9*100);const readiness=r.readiness?.percent||0;
 const mod=[['Reading','book-reader','reading'],['Writing','pen-nib','writing'],['Listening','headphones','listening'],['Speaking','microphone','speaking']];
 const totalMinutes=parseInt((o.study.dailyMinutes||'45').match(/\d+/)?.[0]||45);
 const planRows=[
  [priority,r.plan.lesson,Math.max(10,Math.round(totalMinutes*.4)),'fa-bullseye'],
  ['Supporting practice',r.plan.practice,Math.max(10,Math.round(totalMinutes*.3)),'fa-dumbbell'],
  [r.plan.secondary,'Targeted review for '+r.plan.secondary,Math.max(5,Math.round(totalMinutes*.2)),'fa-book-open'],
  ['Reflection','Update your mistake log after practice',Math.max(5,totalMinutes-Math.max(10,Math.round(totalMinutes*.4))-Math.max(10,Math.round(totalMinutes*.3))-Math.max(5,Math.round(totalMinutes*.2))),'fa-rotate-left']
 ];
 return `<div class="greeting"><div><h1>${greeting()}, ${escapeHtml(profileName())} 🎉</h1><p>Here’s your personalized learning overview, based on the diagnostic evidence you just provided.</p></div><span class="badge badge-ai"><i class="fa-solid fa-sparkles"></i> Phase 3 · Personalized</span></div>
 <div class="grid4"><div class="card metric-card"><div class="bubble"></div><div class="eyebrow">Overall IELTS</div><div class="metric-value">${r.overall.toFixed(1)}</div><div class="metric-sub">Estimated · provisional</div></div><div class="card metric-card"><div class="bubble" style="background:var(--emerald-50)"></div><div class="eyebrow">Target score</div><div class="metric-value">${escapeHtml(target.toFixed(1))}</div><div class="metric-sub">Goal: ${fmtDate(o.goal.examDate)}</div></div><div class="card metric-card"><div class="bubble" style="background:var(--ai-50)"></div><div class="eyebrow">CEFR level</div><div class="metric-value">${escapeHtml(r.cefr)}</div><div class="metric-sub">Initial estimate from diagnostic</div></div><div class="card metric-card"><div class="bubble" style="background:var(--amber-50)"></div><div class="eyebrow">Confidence</div><div class="metric-value" style="font-size:22px;color:var(--amber-600)">${escapeHtml(r.confidence.overall)}</div><div class="metric-sub">Refined by future evidence</div></div></div>
 <div class="card card-pad" style="margin-top:16px"><h3 class="section-title">Module Scores <span class="badge badge-gray">Provisional</span></h3><div class="grid4" style="gap:10px">${mod.map(([name,icon,key])=>{const score=r.moduleScores[key];const p=r.skillPercentages[name]||0;return `<div class="module-card" onclick="openModule('${name}')"><div class="module-top"><div class="module-name"><i class="fa-solid fa-${icon}"></i>${name}</div><div class="module-score">${score.toFixed(1)}</div></div><div class="bar"><span style="width:${p}%"></span></div><div class="small muted" style="margin-top:6px">${p}% diagnostic evidence · ${escapeHtml(r.confidence[key])} confidence</div></div>`}).join('')}</div></div>
 <div class="split2" style="margin-top:16px"><div><div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 class="section-title" style="margin:0"><i class="fa-solid fa-calendar-day" style="color:var(--brand-500)"></i> Today’s Learning Plan</h3><span class="badge badge-blue">~${totalMinutes} min</span></div>${planRows.map(([a,b,t,ic])=>`<div class="plan-item"><div class="plan-main"><div class="plan-icon"><i class="fa-solid ${ic}"></i></div><span><strong>${escapeHtml(a)}</strong><br><span class="small muted">${escapeHtml(b)}</span></span></div><span class="plan-time">${t} min</span></div>`).join('')}<button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="openModule('Today’s Plan')">Start today’s plan <i class="fa-solid fa-play"></i></button></div>
 <div class="split2" style="margin-top:16px"><div class="card card-pad priority"><div class="eyebrow" style="color:var(--rose-600)">Your biggest priority</div><h3 style="font-size:20px;margin:5px 0">${escapeHtml(priority)}</h3><div class="muted" style="font-size:12px">Based on your lowest diagnostic evidence score.</div><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-top:16px"><span>Evidence strength</span><span>${r.skillPercentages[priority]||0}%</span></div><div class="bar" style="background:#fff"><span style="background:var(--rose-500);width:${r.skillPercentages[priority]||0}%"></span></div><button class="btn btn-secondary" style="width:100%;margin-top:13px;color:var(--rose-600);border-color:var(--rose-100)" onclick="openModule('${escapeHtml(priority)}')">Work on ${escapeHtml(priority)}</button></div>
 <div class="card card-pad"><h3 class="section-title"><i class="fa-solid fa-forward-step" style="color:var(--emerald-600)"></i> Why these priorities?</h3><p class="muted" style="font-size:12px;line-height:1.7;margin:0">Your plan begins with <strong>${escapeHtml(priority)}</strong> because it was the weakest area in the diagnostic evidence. ${escapeHtml(r.plan.secondary)} is next, so your daily practice is not randomly throwing subjects at you.</p><div class="notice" style="margin-top:12px">English variety: <strong>${escapeHtml(o.language.englishVariant)}</strong><br>Explanation language: <strong>${escapeHtml(o.language.explanationLanguage)}</strong></div></div></div>
 </div>
 <div><div class="ai-card"><div class="ai-inner"><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="background:var(--ai-100);color:var(--ai-700)"><i class="fa-solid fa-robot"></i></div><div><strong>Coach AI</strong><div class="eyebrow" style="color:var(--ai-500)">Personalized insight</div></div></div><div class="ai-msg">Your current diagnostic suggests <strong>${escapeHtml(priority)}</strong> deserves the most attention. Start small: complete today’s priority lesson, then use the supporting practice immediately afterwards. Future sessions will update this recommendation.</div><button class="btn btn-ai" style="width:100%" onclick="openModule('AI Coach')">Ask your coach <i class="fa-solid fa-sparkles"></i></button></div></div>
 <div class="card card-pad streak" style="margin-top:16px"><div class="eyebrow">Learning streak</div><div style="margin-top:5px"><i class="fa-solid fa-fire" style="color:var(--amber-500);font-size:28px"></i> <span class="streak-num">0</span> <span class="muted" style="font-weight:700">days</span></div><div class="days">${['M','T','W','T','F','S','S'].map(x=>`<div class="day off">${x}</div>`).join('')}</div><div class="small muted" style="margin-top:10px">Your streak starts with the first completed learning activity.</div></div>
 <div class="card card-pad" style="margin-top:16px;text-align:center"><div class="eyebrow">IELTS readiness</div><div class="gauge" style="margin-top:10px"><div class="gauge-base"></div><div class="gauge-fill" style="clip-path:polygon(0 0,${Math.min(100,readiness)}% 0,50% 100%,0 100%)"></div><div class="gauge-inner"></div><div class="gauge-needle" style="transform:rotate(${(-55+readiness*1.1).toFixed(1)}deg)"></div><div class="gauge-dot"></div></div><div style="font-size:19px;font-weight:800">${readiness}% ready</div><div class="small muted" style="margin-top:3px">Learning stage: ${escapeHtml(r.readiness.label)} · not an official readiness score</div></div></div></div>
 <div class="card card-pad" style="margin-top:16px"><h3 class="section-title"><i class="fa-solid fa-flag-checkered" style="color:var(--brand-600)"></i> IELTS readiness path</h3><div class="grid4">${[['Foundation',100],['Pre-IELTS',Math.min(100,Math.max(30,readiness+15))],['IELTS Practice',Math.min(100,Math.max(0,readiness-10))],['Exam Ready',0]].map(([n,p],i)=>`<div style="padding:13px;border:1px solid var(--slate-100);border-radius:12px;background:${i===0?'var(--emerald-50)':'#fff'}"><div style="font-size:11px;font-weight:800">${n}</div><div style="font-size:10px;color:var(--slate-400);margin:5px 0 7px">${i===0?'Complete':i===1?'Developing':i===2?'Not yet':'No'}</div><div class="bar"><span style="width:${p}%;background:${i===0?'var(--emerald-500)':'linear-gradient(90deg,var(--brand-500),var(--ai-500))'}"></span></div></div>`).join('')}</div></div>
 <div class="footer-note">Initial estimates are based on limited diagnostic evidence. Your profile should become more accurate as you learn, practise and complete additional assessments.</div>`
}
function openModule(name){
 const locked=state.diagnostic.status!=='complete'&&['Exam','Reading','Writing','Listening','Speaking'].includes(name);
 const msg=locked?`<div class="badge badge-amber">Assessment required</div><h2>${escapeHtml(name)} is limited for now.</h2><p class="muted">Complete the diagnostic to unlock deeper, learner-aware ${escapeHtml(name)} practice. The prototype intentionally avoids pretending that personalization exists before evidence does.</p><button class="btn btn-primary" onclick="closeModal();setPage('02_diagnostic.html')">Continue assessment <i class="fa-solid fa-arrow-right"></i></button>`:`<div class="badge badge-blue">Prototype workspace</div><h2>${escapeHtml(name)}</h2><p class="muted">This route is connected and ready to be replaced by the real ${escapeHtml(name)} module later. The current prototype keeps the product flow functional without overbuilding backend services.</p><div class="notice" style="margin-top:12px"><i class="fa-solid fa-circle-info"></i> Future implementation can attach RAG, learning-engine, analytics, LLM, STT or TTS services here.</div><button class="btn btn-primary" style="margin-top:16px" onclick="closeModal()">Back to dashboard</button>`;
 showModal(msg)
}
function openProfile(){
 const o=state.onboarding;showModal(`<div class="eyebrow">Profile & preferences</div><h2 style="margin:5px 0 16px">Edit your learner profile</h2><div class="field"><label>First name</label><input class="input" id="editName" value="${escapeHtml(state.user.firstName||'')}"></div><div class="field" style="margin-top:12px"><label>Target band</label><select class="select" id="editBand">${['5.0','5.5','6.0','6.5','7.0','7.5','8.0','8.5','9.0'].map(x=>`<option ${String(o.goal.targetBand)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Exam date</label><input class="input" type="date" id="editDate" value="${escapeHtml(o.goal.examDate||'')}"></div><div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveProfileEdits()">Save changes</button></div>`)}
function saveProfileEdits(){state.user.firstName=document.getElementById('editName').value.trim()||'Student';state.onboarding.goal.targetBand=document.getElementById('editBand').value;state.onboarding.goal.examDate=document.getElementById('editDate').value;saveState();closeModal();renderDashboard();showToast('Profile updated.')}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function closeModalOnBackdrop(e){if(e.target.id==='modalBackdrop')closeModal()}
renderDashboard();
</script>
