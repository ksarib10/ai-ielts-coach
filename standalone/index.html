function searchKey(e,input){if(e.key==="Enter"&&input.value.trim())nav("/learn?search="+encodeURIComponent(input.value.trim()))}
function page(r){
 if(r==="/dashboard")return dashHome();
 if(r==="/learn"||r.startsWith("/learn?"))return learn(r);
 if(r.startsWith("/learn/"))return lesson(r.split("/")[2]);
 if(r==="/practice"||r.startsWith("/practice"))return practice();
 if(r==="/reading")return readingHome();
 if(r==="/reading/practice")return readingPractice();
 if(r.startsWith("/reading/test/"))return readingTest();
 if(r.startsWith("/reading/results/"))return readingResults();
 if(r==="/writing")return writingHome();
 if(r.startsWith("/writing/task/"))return writingTask();
 if(r.startsWith("/writing/results/"))return writingResults();
 if(r==="/listening")return listeningHome();
 if(r.startsWith("/listening/test/"))return listeningTest();
 if(r==="/speaking"||r.startsWith("/speaking/"))return speakingHome();
 if(r==="/progress")return progressPage();
 if(r==="/mistakes")return mistakesPage();
 if(r==="/saved")return savedPage();
 if(r==="/ai-coach")return coachPage();
 if(r==="/mock-tests")return mocksPage();
 if(r==="/exam-simulation")return simPage();
 if(r==="/readiness")return readinessPage();
 if(r==="/profile")return profilePage();
 if(r==="/settings")return settingsPage();
 if(r==="/help")return helpPage();
 return workspace("Connected workspace","This route is connected to the same product shell and state model.");
}
function landing(){return `<div class="landing"><header class="landing-top"><button class="brand" onclick="nav('/')"><span class="mark"><i class="fa-solid fa-graduation-cap"></i></span>AI IELTS Coach</button><div class="landing-actions"><button class="login" onclick="nav('/login')">Log in</button><button class="btn primary" onclick="nav('/register')">Get started</button></div></header><main class="landing-main"><section class="landing-copy"><span class="badge purple">PERSONALIZED ENGLISH + IELTS COACHING</span><h1>Understand your English. <span>Know what to do next.</span></h1><p>AI IELTS Coach turns goals and assessment evidence into a focused learning path for English learners, from A1 foundations to advanced IELTS preparation.</p><div class="landing-cta"><button class="btn primary" onclick="nav('/register')">Start your journey <i class="fa-solid fa-arrow-right"></i></button><button class="btn secondary" onclick="nav('/login')">I already have a profile</button></div><div class="points"><span>✓ Reading</span><span>✓ Writing</span><span>✓ Listening</span><span>✓ Speaking</span><span>✓ Uzbek support</span><span>✓ UK / US English</span></div></section><section class="preview"><div class="preview-top"><span class="mini-dot"></span><span class="mini-dot"></span><span class="mini-dot"></span><small>AI IELTS Coach</small></div><div class="preview-grid"><div class="preview-score"><span class="small muted">PROVISIONAL PROFILE</span><strong>5.5</strong><span class="muted">Estimated IELTS</span></div><div class="preview-card"><span class="small muted">CURRENT FOCUS</span><strong>Reading inference</strong><span class="small muted">Your next high-impact skill</span></div><div class="preview-card"><span class="small muted">TODAY</span><strong>25 min plan</strong><span class="small muted">Learn → practise → review</span></div></div></section></main></div>`}
function auth(register){return `<div class="auth-page"><div class="card auth"><button class="brand auth-brand" onclick="nav('/')"><span class="mark"><i class="fa-solid fa-graduation-cap"></i></span>AI IELTS Coach</button><div class="eyebrow">${register?"GET STARTED":"WELCOME BACK"}</div><h1>${register?"Create your learner profile":"Open your learner profile"}</h1><p class="muted">This prototype stores account state locally so the full journey can be demonstrated without a backend.</p><div class="form"><div class="field"><label>First name</label><input id="authName" class="input" placeholder="e.g. Dilnoza"></div><div class="field"><label>Email</label><input class="input" type="email" placeholder="student@example.com"></div><div class="field"><label>Password</label><input class="input" type="password" placeholder="••••••••"></div><button class="btn primary" onclick="authContinue(${register})">${register?"Create profile":"Continue"} <i class="fa-solid fa-arrow-right"></i></button></div><button class="btn ghost" style="margin-top:8px" onclick="nav('${register?"/login":"/register"}')">${register?"Already registered? Log in":"New student? Create a profile"}</button></div></div>`}
function authContinue(register){const s=state();const name=(document.getElementById("authName")?.value||"").trim()||"Student";s.user.firstName=name;if(register){s.onboarding.complete=false;s.onboarding.step=0;s.diagnostic.status="not_started";s.diagnostic.currentSection=0;s.diagnostic.currentQuestion=0;s.diagnostic.completedSections=[];s.results=null;}save(s);nav(register?"/onboarding":"/dashboard")}
function dashboard(){return shell("/dashboard")}

function header(ey,title,desc,act=""){return `<div class="page-head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1>${desc?`<p class="muted">${desc}</p>`:""}</div>${act}</div>`}
function dashHome(){const s=state();const st=s.results?"complete":s.diagnostic.status==="in_progress"?"partial":s.diagnostic.status==="skipped"?"skipped":"not_started";const name=s.user.firstName||"Student"; if(!s.onboarding.complete)return `<div class="card" style="max-width:620px;margin:90px auto;padding:30px;text-align:center"><span class="badge blue">WELCOME</span><h2>Let’s get your profile started.</h2><p class="muted">A few choices about your goals, English preference and study time make the rest of the application useful.</p><button class="btn primary" onclick="nav('/onboarding')">Continue onboarding <i class="fa-solid fa-arrow-right"></i></button></div>`;
 let content=""; if(st==="not_started")content=stateBanner("blue","Let’s Discover Your English Level","Take the diagnostic to unlock deeper personalization. You can still learn basic lessons while you decide.",["Grammar","Vocabulary","Reading","Writing","Listening","Speaking"],"Start assessment","/diagnostic","Continue learning","/learn"); else if(st==="skipped")content=stateBanner("amber-banner","Diagnostic not started","You can learn general English now, but no IELTS estimate or CEFR is shown until you submit diagnostic evidence.",["General English","Basic lessons","IELTS information"],"Start assessment","/diagnostic","Continue learning","/learn"); else if(st==="partial")content=stateBanner("amber-banner","Assessment Incomplete",`You’ve completed ${s.diagnostic.completedSections.length} of 7 sections. Continue from where you left off or learn while the rest remains unfinished.`,s.diagnostic.completedSections.map(id=>sections.find(x=>x.id===id)?.name||id),"Continue assessment","/diagnostic","Learn while you complete it","/learn"); else content=personalHero(s);
 return `<div><div style="display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px"><div><h1 style="margin:0">Good ${new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening"}, ${esc(name)} 👋</h1><p class="muted" style="margin:5px 0 0">${s.results?`Your current focus is ${(s.results.priorities[0]||"learning").toLowerCase()}.`:"Complete a short diagnostic so the coach can understand where to guide you."}</p></div><span class="badge blue">Target IELTS ${s.onboarding.targetBand}</span></div>${content}${st==="complete"?completedDash(s):preDash(s)}</div>`}
function stateBanner(tone,title,text,chips,primary,path1,secondary,path2){return `<div class="state-banner ${tone==="amber-banner"?"amber-banner":""}"><div><span class="badge gray">${tone==="amber-banner"?"ACTION NEEDED":"PRIORITY ACTION"}</span><h2>${title}</h2><p>${text}</p><div class="chips">${chips.map(x=>`<span class="chip"><i class="fa-solid fa-check"></i>${x}</span>`).join("")}</div><div class="banner-actions"><button class="btn secondary" onclick="nav('${path1}')">${primary} <i class="fa-solid fa-arrow-right"></i></button><button class="btn" style="background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff" onclick="nav('${path2}')">${secondary}</button></div></div></div>`}
function personalHero(s){const w=s.results.priorities[0]||"Reading";return `<div class="personal-hero"><div><span class="badge purple">PERSONALIZED</span><h2>Your next step is clearer now.</h2><p>We found <strong>${w}</strong> to be your highest-priority improvement area. Your dashboard now adapts around your diagnostic evidence and ${s.onboarding.targetBand} target.</p><button class="btn primary" onclick="nav('/learn')">View learning plan <i class="fa-solid fa-arrow-right"></i></button></div><div class="hero-score"><span>Estimated IELTS</span><strong>${s.results.overall}</strong><small>Provisional · target ${s.onboarding.targetBand}</small></div></div>`}
function preDash(s){return `<div class="grid3"><div class="card profile-card"><div class="card-title"><span><i class="fa-regular fa-id-card"></i> Your Profile</span><button class="text-link" onclick="openEditProfile()">Edit</button></div><div class="profile-row"><span>Goal</span><strong>IELTS ${s.onboarding.targetBand}</strong></div><div class="profile-row"><span>Target date</span><strong>${s.onboarding.examDate||"Not set"}</strong></div><div class="profile-row"><span>English</span><strong>${s.onboarding.englishVariant==="UK"?"🇬🇧 UK":"🇺🇸 US"}</strong></div><div class="profile-row"><span>Explanations</span><strong>${s.onboarding.explanationLanguage}</strong></div></div>${feature("fa-brain","Smart Learning","Personalized lessons after diagnostic")}${feature("fa-stopwatch","Real Practice","IELTS-style practice materials")}</div>`}
function feature(i,t,d){return `<div class="card feature-card"><div class="feature-icon"><i class="fa-solid ${i}"></i></div><h3 style="margin:0 0 4px">${t}</h3><p class="muted" style="margin:0">${d}</p></div>`}
function completedDash(s){const weakest=s.results.priorities[0]||"Reading", plan=s.results.plan[0];return `<div class="stats">${stat("Estimated IELTS",s.results.overall,"Target "+s.onboarding.targetBand)}${stat("Current CEFR",s.results.cefr,s.results.overallConfidence+" confidence")}${stat("Streak",s.progress.streak+" days","Keep your next session small.")}${stat("Readiness",s.results.readiness,"Not official readiness")}</div><div class="grid2" style="margin-top:16px"><div class="card" style="padding:20px"><div class="card-title"><span>Today’s plan</span><span class="badge purple">PERSONALIZED</span></div><h2>${plan?.title||weakest}</h2><p class="muted">${plan?.reason||"Complete another activity to refine your plan."}</p><button class="btn primary" onclick="nav('/learn/${weakest.toLowerCase().replaceAll(' ','-')}')">Start <i class="fa-solid fa-play"></i></button></div><div class="card" style="padding:20px"><div class="card-title"><span>Biggest priority</span><span class="badge amber">FOCUS</span></div><h2>${weakest}</h2><p class="muted">This area currently has the largest opportunity for improvement in your diagnostic evidence.</p><button class="btn secondary" onclick="nav('/learn')">Open recommended lesson <i class="fa-solid fa-arrow-right"></i></button></div></div><div class="grid3" style="margin-top:16px">${["Reading","Writing","Listening"].map(x=>`<div class="card module-mini"><div class="module-name"><span>${x}</span><strong>${s.results.moduleScores[x]?.band||"—"}</strong></div><div class="progress"><span style="width:${((s.results.moduleScores[x]?.band||0)/9*100)}%"></span></div><button onclick="nav('/${x.toLowerCase()}')">Open module <i class="fa-solid fa-arrow-right"></i></button></div>`).join("")}</div><div class="card" style="padding:20px;margin-top:16px"><div class="card-title"><span>Recent activity</span><button class="text-link" onclick="nav('/progress')">View progress <i class="fa-solid fa-arrow-right"></i></button></div><div class="activity">${(s.progress.recent.length?s.progress.recent:[{title:"No activity yet",detail:"Complete a lesson to start your history.",date:"Demo"}]).map(a=>`<div><span>${a.title}</span><small>${a.detail} · ${a.date}</small></div>`).join("")}</div></div>`}
function stat(a,b,c){return `<div class="card"><span class="small muted">${a}</span><strong class="big">${b}</strong><span class="small">${c}</span></div>`}
function learn(){const s=state(),weak=s.results?.priorities?.[0]||"Reading";const q=location.hash.split("?")[1]||"";return header("STUDY","Learn","A focused learning path adapted around your goals and current priorities.",`<button class="btn primary" onclick="nav('/learn/${weak.toLowerCase()}')">Recommended lesson <i class="fa-solid fa-arrow-right"></i></button>`)+`<div class="learning-hero"><div><span class="badge purple">WHAT SHOULD I LEARN NEXT?</span><h2>${weak} is currently the highest-impact area.</h2><p>${q.startsWith("search")?"Showing search-aware learning results.":s.results?"Your diagnostic evidence is shaping these recommendations.":"Complete the diagnostic for deeper personalization. Basic lessons are still available."}</p></div></div><div class="card" style="padding:18px"><div class="card-title"><span>Learning path</span><span class="small muted">Start where your profile makes sense</span></div><div class="path">${path.map((x,i)=>`<div class="path-step ${i<2?"done":""}"><div class="path-node">${i<2?"✓":i===2?"→":""}</div><span>${x}</span>${i<path.length-1?'<div class="path-line"></div>':""}</div>`).join("")}</div></div><div class="lesson-grid">${lessons.map(l=>`<div class="card lesson"><div class="lesson-head"><span class="badge ${l[2]===weak?"purple":"gray"}">${l[2]}</span><span class="small muted">${l[4]}</span></div><h3>${l[1]}</h3><p>${l[5]}</p><div class="lesson-foot"><span>${l[3]}</span><button class="text-link" onclick="nav('/learn/${l[0]}')">Open <i class="fa-solid fa-arrow-right"></i></button></div></div>`).join("")}</div>`}
function lesson(id){const l=lessons.find(x=>x[0]===id)||lessons[0];return header("LESSON",l[1],`${l[2]} · ${l[3]} · ${l[4]}`)+`<div class="lesson-layout"><div class="card lesson-main"><div class="lesson-section"><span class="badge blue">OBJECTIVE</span><h2>Use the target skill more accurately and confidently.</h2><p>Lesson content is structured like the future personalized learning engine. Curated explanations and generated practice can be injected here later.</p></div><div class="lesson-section"><span class="badge gray">EXPLANATION</span><h3>Start with the pattern</h3><p>Notice the relationship between meaning, form and context. Then compare a common mistake against a better approach.</p><div class="example-grid"><div class="wrong"><strong>Common mistake</strong><p>Choosing a form because it “sounds right” without checking the sentence relationship.</p></div><div class="right"><strong>Better approach</strong><p>Identify the context first, then choose the form that matches.</p></div></div></div><div class="lesson-section"><span class="badge purple">PRACTICE</span><h3>Quick check</h3><button class="option" onclick="completeLesson('${l[0]}')"><span class="letter">A</span><span>Identify context, then select the form that fits.</span></button></div></div><div class="card side-card"><span class="badge purple">AI ASSISTANCE</span><h3>Ask about this lesson</h3><p class="muted">The global AI Coach is available in learning mode.</p><button class="btn ai-btn" onclick="toggleAI()">Open AI Coach</button></div></div>`}
function completeLesson(id){const s=state();const l=lessons.find(x=>x[0]===id)||lessons[0];s.progress.lessons++;s.progress.recent=[{title:l[1],detail:"Lesson completed",date:"Today"},...s.progress.recent].slice(0,5);save(s);toast("Lesson completed");nav("/dashboard")}
function practice(){const s=state();const weak=s.results?.priorities?.[0]||"Reading";return header("STUDY","Practice","Short practice sets designed to turn lessons into measurable evidence.")+`<div class="tabs"><button class="tab active">Recommended</button><button class="tab">By skill</button><button class="tab">Question type</button><button class="tab">Timed</button></div><div class="practice-grid">${lessons.map((l,i)=>`<div class="card practice"><div class="lesson-head"><span class="badge ${i===0?"purple":"gray"}">${l[2]}</span><span>${l[4]}</span></div><h3>${l[1]}</h3><div class="practice-meta"><span>${l[3]}</span><span>${i%2?"Moderate":"Focused"}</span><span>High IELTS relevance</span></div><p>${s.results?`Recommended because ${l[5].toLowerCase()}`:"Available now. Complete the diagnostic later for smarter recommendations."}</p><button class="btn secondary" onclick="nav('${l[2]==="Reading"?"/reading/practice":l[2]==="Writing"?"/writing/task/2":l[2]==="Listening"?"/listening":l[2]==="Speaking"?"/speaking":"/learn"}')">Start practice <i class="fa-solid fa-arrow-right"></i></button></div>`).join("")}</div>`}
function readingHome(){return header("IELTS · READING","Reading","Build accuracy, review question types, and use the reusable PDF resource system.")+`<div class="module-hero"><div><span class="badge blue">MODULE WORKSPACE</span><h2>Build accuracy before adding more speed.</h2><p>Learning mode is flexible. Practice is targeted. Tests use stricter controls.</p></div><div class="hero-score"><span>Current estimate</span><strong>${state().results?.moduleScores.Reading.band??"—"}</strong></div></div><div class="module-menu-grid">${menuCard("Recommended Reading","Focused passages selected from your current priorities","/reading/practice")}${menuCard("Question-Type Practice","Main idea, inference and paraphrase recognition","/reading/practice")}${menuCard("Reading Test","PDF + question panel with timed controls","/reading/test/sample-1")}${menuCard("Detailed Analysis","Review performance by question type","/reading/results/sample-1")}</div><div class="card pdf-card"><div class="card-title"><span>PDF resource</span><span class="badge gray">REAL BROWSER PDF RENDERING</span></div>${pdfViewer()}</div>`}
function menuCard(t,d,path){return `<div class="card menu"><div><h3>${t}</h3><p>${d}</p></div><button class="btn ghost" onclick="nav('${path}')">Open <i class="fa-solid fa-arrow-right"></i></button></div>`}
function pdfViewer(){return `<div class="pdf-tools"><button class="btn secondary" onclick="pdfPage(-1)"><i class="fa-solid fa-chevron-left"></i></button><button class="btn secondary" onclick="pdfPage(1)"><i class="fa-solid fa-chevron-right"></i></button><button class="btn secondary" onclick="pdfZoom(.1)"><i class="fa-solid fa-plus"></i></button><button class="btn secondary" onclick="pdfZoom(-.1)"><i class="fa-solid fa-minus"></i></button><button class="btn secondary" onclick="pdfFullscreen()"><i class="fa-solid fa-expand"></i></button><input id="pdfSearch" placeholder="Search resource text (metadata index)" onkeydown="if(event.key==='Enter')pdfSearch()"><button class="btn secondary" onclick="pdfSearch()">Search</button><span id="pdfMsg" class="small muted"></span></div><iframe id="pdfFrame" class="pdf-frame" src="sample-reading.pdf#page=1&zoom=100" title="Reading PDF resource"></iframe>`}
let pdfPg=1,pdfZm=1;
function pdfPage(n){pdfPg=Math.max(1,Math.min(3,pdfPg+n));const f=document.getElementById("pdfFrame");f.src=`sample-reading.pdf#page=${pdfPg}&zoom=${Math.round(pdfZm*100)}`}
function pdfZoom(n){pdfZm=Math.max(.7,Math.min(1.6,pdfZm+n));const f=document.getElementById("pdfFrame");f.src=`sample-reading.pdf#page=${pdfPg}&zoom=${Math.round(pdfZm*100)}`}
function pdfFullscreen(){document.getElementById("pdfFrame")?.requestFullscreen?.()}
function pdfSearch(){const q=(document.getElementById("pdfSearch")?.value||"").toLowerCase();const map={urban:2,garden:2,green:2,practice:3,viewer:3,resource:1};const hit=Object.keys(map).find(x=>q.includes(x));const msg=document.getElementById("pdfMsg");if(hit){pdfPg=map[hit];pdfPage(0);msg.textContent=`Found on page ${pdfPg}`; }else msg.textContent=q?"No indexed match in prototype metadata":"Type a word";}
function readingPractice(){return header("READING · PRACTICE","Question-type practice","Focused inference and paraphrase work.")+`<div class="card" style="padding:20px"><div class="eyebrow">PASSAGE</div><h2>Urban green spaces and city life</h2>${passage.slice(0,2).map(p=>`<p>${p}</p>`).join("")}<div class="card" style="padding:15px;background:var(--slate-50);margin-top:14px"><div class="eyebrow">TARGET SKILL</div><h3>Inference</h3><p class="muted">Use evidence across sentences to support an unstated conclusion.</p><button class="btn primary" onclick="toast('Practice completed')">Finish practice <i class="fa-solid fa-arrow-right"></i></button></div></div>`}
function readingTest(){return header("READING · TEST","Reading test environment","AI assistance is disabled in test mode.")+`<div class="testbar"><span><i class="fa-regular fa-clock"></i> 58:42</span><span class="badge amber">AI DISABLED</span><span>Section 1 · 12 questions</span></div><div class="reading-workspace"><div class="card passage-panel">${pdfViewer()}</div><div class="card question-panel"><div class="small muted">Question 1 of 12</div><h3>What is the main idea of the passage?</h3>${sections[2].qs[0][2].map((x,i)=>`<button class="option ${i===1?"selected":""}"><span class="letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join("")}<div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn secondary">Previous</button><button class="btn primary" onclick="nav('/reading/results/sample-1')">Submit test <i class="fa-solid fa-arrow-right"></i></button></div></div></div>`}
function readingResults(){return header("READING · RESULTS","A better review than 'you got 7/10'.","See which question types need work and what to practice next.")+`<div class="stats">${stat("Estimated band","6.5","Provisional practice result")}${stat("Accuracy","78%","Overall attempt")}${stat("Inference","52%","Highest-priority skill")}${stat("Time","31 min","Within target range")}</div><div class="grid2" style="margin-top:16px"><div class="card" style="padding:20px"><div class="card-title"><span>Detailed analysis</span></div>${["Main idea","Specific information","Vocabulary in context","Inference","Paraphrase"].map((x,i)=>`<div class="analysis"><span>${x}</span><strong>${[88,91,83,52,76][i]}%</strong><div class="progress"><span style="width:${[88,91,83,52,76][i]}%"></span></div></div>`).join("")}</div><div class="card" style="padding:20px"><span class="badge purple">RECOMMENDED REMEDIATION</span><h2>Make inference less of a guess.</h2><p class="muted">You missed more inference items than direct-detail items in this attempt.</p><button class="btn primary" onclick="nav('/learn/reading-inference')">10-minute lesson <i class="fa-solid fa-arrow-right"></i></button></div></div>`}
function writingHome(){return header("IELTS · WRITING","Writing","A distraction-free workspace for planning, drafting, evaluating and improving.")+`<div class="module-menu-grid">${menuCard("Writing Home","See current writing priorities and history","/writing")}${menuCard("Task Selection","Choose Task 1 or Task 2 style practice","/writing/task/2")}${menuCard("Writing Workspace","Prompt + editor + word count + autosave","/writing/task/2")}${menuCard("History","Compare submissions and feedback","/writing/results/sample-1")}</div>`}
function writingTask(){return header("WRITING · TASK 2","Writing workspace","Practice mode · AI assistance limited.")+`<div class="writing-workspace"><div class="card prompt-pane"><span class="badge blue">TASK 2</span><h2>Prompt</h2><blockquote>${writingPrompt}</blockquote><div class="small muted">Target: 250+ words · 40 min practice</div></div><div class="card" style="overflow:hidden"><div class="editor-top"><span>Your response</span><span id="wc">0 words</span></div><textarea id="writingInput" class="editor" placeholder="Start with your position, then develop both views clearly..." oninput="document.getElementById('wc').textContent=wordCount(this.value)+' words'"></textarea><div class="editor-bottom"><span class="small muted"><i class="fa-solid fa-check"></i> Auto-saved locally</span><button class="btn primary" onclick="writingSubmit()">Submit for provisional evaluation</button></div></div></div><div id="writingFeedback"></div>`}
function writingSubmit(){const n=wordCount(document.getElementById("writingInput").value);document.getElementById("writingFeedback").innerHTML=`<div class="card" style="padding:20px;margin-top:16px"><span class="badge purple">PROVISIONAL FEEDBACK</span><h2>Good structure, but precision can improve.</h2><div class="score-grid">${["Task Response","Coherence & Cohesion","Lexical Resource","Grammar"].map((x,i)=>`<div class="card score-card"><span class="small muted">${x}</span><strong>${[6.5,6,6,5.5][i]}</strong><div class="progress"><span style="width:${[72,67,63,54][i]}%"></span></div></div>`).join("")}</div><p class="muted">${n<250?"Your draft is below the target length.":"Prototype evaluation generated from submitted evidence. A real scoring service can replace this later."}</p></div>`}
function writingResults(){return header("WRITING · RESULTS","Detailed feedback","Provisional evaluation that can later be replaced with a scoring service.")+`<div class="score-grid">${["Task Response","Coherence & Cohesion","Lexical Resource","Grammar"].map((x,i)=>`<div class="card score-card"><span class="small muted">${x}</span><strong>${[6.5,6,6,5.5][i]}</strong><div class="progress"><span style="width:${[72,67,63,54][i]}%"></span></div><span class="small muted">${i===3?"Priority: sentence accuracy":"Developing"}</span></div>`).join("")}</div><div class="card" style="padding:20px;margin-top:16px"><div class="card-title"><span>Improvement plan</span><span class="badge purple">NEXT</span></div>${["Strengthen complex grammar control","Add precise topic vocabulary","Use clearer paragraph-level linking"].map((x,i)=>`<div class="profile-row"><strong>0${i+1}</strong><span>${x}</span><span>Targeted lesson</span></div>`).join("")}</div>`}

function speakingHome(){return header("IELTS · SPEAKING","Speaking","A focused recording experience for Part 2 responses, with future STT/TTS boundaries prepared.")+`<div class="card speaking-card"><div id="speakState" class="badge gray">READY</div><div class="cue"><div class="eyebrow">PART 2 CUE CARD</div><h2>Describe a skill you would like to learn in the future.</h2><ul>${speakingBullets.map(x=>`<li>${x}</li>`).join("")}</ul></div><div id="speakTimer" class="timer">1:00</div><p id="speakHint" class="muted">When you start, you will have 1 minute to prepare.</p><div id="speakAction"><button class="btn primary" onclick="startSpeaking()">Start speaking task <i class="fa-solid fa-microphone"></i></button></div><div class="notice" style="max-width:680px;margin:15px auto;background:var(--brand-50);padding:12px;border-radius:11px"><i class="fa-solid fa-lock"></i> Speaking recordings are locally represented as interaction state in this prototype.</div></div>`}
function startSpeaking(){let sec=0;const stateEl=document.getElementById("speakState"),timer=document.getElementById("speakTimer"),hint=document.getElementById("speakHint"),act=document.getElementById("speakAction");stateEl.className="badge amber";stateEl.textContent="PREPARING";clearInterval(speakingTimer);speakingTimer=setInterval(()=>{sec++;timer.textContent=sec<60?`${sec}s`:"0s";if(sec>=2){clearInterval(speakingTimer);stateEl.className="badge green";stateEl.textContent="RECORDING";hint.textContent="Recording is active. Up to 2 minutes.";act.innerHTML=`<button class="btn primary" onclick="submitSpeaking(${sec})">Submit response <i class="fa-solid fa-paper-plane"></i></button>`;let r=0;speakingTimer=setInterval(()=>{r++;timer.textContent=`${120-r}s`;if(r>=120)submitSpeaking(120)},1000)}},1000)}

let simInt=null;function startSim(){let sec=120;clearInterval(simInt);document.getElementById("simBody").innerHTML=`<div class="sim-row"><strong>Reading</strong><p class="muted">Question 3 of 5</p><div class="progress"><span style="width:60%"></span></div></div><div class="sim-row"><strong>Writing</strong><p class="muted">Locked until Reading submission</p></div><div class="sim-row"><strong>Listening</strong><p class="muted">Locked</p></div><div class="sim-row"><strong>Speaking</strong><p class="muted">Locked</p></div>`;simInt=setInterval(()=>{sec--;const c=document.getElementById("simClock");if(c)c.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec<=0)clearInterval(simInt)},1000)}
function readinessPage(){const s=state(),t=s.onboarding.targetBand;return header("READINESS","IELTS readiness","A planning view, not an official readiness determination.")+`<div class="readiness">${["Reading","Writing","Listening","Speaking"].map(x=>{const v=s.results?.moduleScores[x]?.band||0;const g=v?Math.max(0,t-v):null;return`<div class="card"><span class="small muted">${x}</span><strong class="big">${v||"—"}</strong><div class="analysis" style="grid-template-columns:1fr 1fr"><span>Target ${t}</span><span>${g===null?"Diagnostic needed":g<=0?"On target":g.toFixed(1)+" band gap"}</span></div><div class="progress"><span style="width:${v?Math.min(100,v/t*100):0}%"></span></div><p class="small muted">${g===null?"Blocker: complete diagnostic":g>1?"Blocker: targeted improvement":"Next: maintain practice"}</p></div>`}).join("")}</div>`}
function profilePage(){const s=state();return header("ACCOUNT","Profile","The learner profile that powers personalization.")+`<div class="profile-grid"><div class="card profile-section"><div class="profile-hero"><div class="avatar">${esc((s.user.firstName||"S")[0].toUpperCase())}</div><div><h2>${esc(s.user.firstName||"Student")}</h2><p class="muted">${esc(s.user.studyContext||"Learner")} · ${esc(s.user.occupation||"No occupation set")}</p></div></div>${[["Age group",s.user.ageGroup||"Not set"],["Target",`IELTS ${s.onboarding.targetBand}`],["Exam date",s.onboarding.examDate||"Not set"],["Reason",s.onboarding.reason||"Not set"]].map(x=>`<div class="profile-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}<button class="btn secondary" style="margin-top:14px" onclick="openEditProfile()">Edit profile</button></div><div class="card profile-section"><div class="card-title"><span>Language & study preferences</span></div>${[["English variety",s.onboarding.englishVariant==="UK"?"🇬🇧 UK English":"🇺🇸 US English"],["Explanation",s.onboarding.explanationLanguage],["Daily time",s.onboarding.dailyMinutes+" minutes"],["Session",s.onboarding.sessionLength+" minutes"],["Intensity",s.onboarding.intensity]].map(x=>`<div class="profile-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div></div>`}

function onboarding(){const s=state();const step=Math.min(5,Math.max(0,s.onboarding.step||0));const data=[["personal","Let’s start with you.","Tell us just enough to make the experience feel like yours."],["goal","What are you preparing for?","Your target shapes what we recommend next."],["language","How should English sound and feel?","English variety and explanation language are separate settings."],["level","How do you see your current English?","This is a self-assessment, not a diagnostic result."],["study","How do you want to study?","We’ll use this to keep recommendations realistic for your schedule."],["intro","One final step: a short diagnostic.","We’ll use a short diagnostic to understand your current ability."]][step];return `<div class="onboarding-page"><header class="onboard-top"><button class="brand" onclick="nav('/')"><span class="mark"><i class="fa-solid fa-graduation-cap"></i></span>AI IELTS Coach</button><button class="save-link" onclick="saveOnboard(${step},true)">Save & exit</button></header><main class="onboard-main"><div class="onboard-hero"><div class="eyebrow">PERSONALIZED LEARNING STARTS HERE</div><h1>${data[1]}</h1><p>${data[2]}</p></div><div class="onboard-shell"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--slate-500)"><span>Step ${step+1} of 6</span><span>${data[0]}</span></div><div class="stepbar">${Array.from({length:6},(_,i)=>`<span class="stepdot ${i<=step?"active":""}"></span>`).join("")}</div><div class="card onboard-card">${onboardStepBody(step,s)}<div class="onboard-actions"><button class="btn secondary" onclick="onboardBack(${step})"><i class="fa-solid fa-arrow-left"></i> Back</button><div style="display:flex;gap:9px;justify-content:flex-end;flex:1">${step===5?`<button class="btn secondary" onclick="skipDiagnostic()">Skip for now</button>`:""}<button class="btn primary" onclick="onboardNext(${step})">${step===5?"Start diagnostic":"Continue"} <i class="fa-solid fa-arrow-right"></i></button></div></div></div></div></main></div>`}
function onboardStepBody(step,s){const o=s.onboarding,u=s.user;if(step===0)return`<h2>Who are we learning with?</h2><div class="form"><div class="field"><label>First name</label><input id="obName" class="input" value="${esc(u.firstName)}" placeholder="e.g. Dilnoza"></div><div class="choice-grid">${["School / college student","University student","Working professional","Other / self-study"].map(x=>`<button class="choice ${u.studyContext===x?"selected":""}" onclick="pickContext('${x}')">🎓 ${x}</button>`).join("")}</div><div class="grid2"><div class="field"><label>Age group · optional</label><select id="obAge" class="select"><option ${u.ageGroup===""?"selected":""}>Prefer not to say</option><option>Under 18</option><option>18–24</option><option>25–34</option><option>35–44</option><option>45+</option></select></div><div class="field"><label>Occupation / status · optional</label><input id="obOcc" class="input" value="${esc(u.occupation)}" placeholder="e.g. Student"></div></div></div>`;if(step===1)return`<h2>What are you preparing for?</h2><div class="choice-grid">${["Academic","General Training"].map(x=>`<button class="choice ${o.ieltsType===x?"selected":""}" onclick="pick('ieltsType','${x}')">📚 IELTS ${x}</button>`).join("")}</div><div class="grid2" style="margin-top:12px"><div class="field"><label>Target band</label><select id="obBand" class="select" onchange="pick('targetBand',Number(this.value))">${[5,5.5,6,6.5,7,7.5,8,8.5,9].map(x=>`<option value="${x}" ${o.targetBand===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Desired exam date</label><input id="obDate" class="input" type="date" value="${o.examDate}"></div></div><div class="field" style="margin-top:12px"><label>Why are you taking IELTS?</label><div class="choice-grid">${["University","Work","Immigration","Professional registration","Other"].map(x=>`<button class="choice ${o.reason===x?"selected":""}" onclick="pick('reason','${x}')">${x}</button>`).join("")}</div></div>`;if(step===2)return`<div><div class="eyebrow">ENGLISH VARIETY</div><h2>Which English do you want to use?</h2><p class="lead">Controls spelling, vocabulary variants, examples, pronunciation and future TTS.</p><div class="choice-grid">${["UK","US"].map(x=>`<button class="choice ${o.englishVariant===x?"selected":""}" onclick="pick('englishVariant','${x}')">${x==="UK"?"🇬🇧 UK English":"🇺🇸 US English"}</button>`).join("")}</div></div><div style="margin-top:18px"><div class="eyebrow">EXPLANATION LANGUAGE</div><h2>How should we explain things?</h2><div class="choice-grid">${["English","Uzbek","English + Uzbek"].map(x=>`<button class="choice ${o.explanationLanguage===x?"selected":""}" onclick="pick('explanationLanguage','${x}')">${x}</button>`).join("")}</div></div>`;if(step===3)return`<span class="badge gray">SELF-ASSESSMENT</span><h2>How would you describe your current English?</h2><p class="lead">This is your perception, not a score produced by AI.</p><div class="level-row">${["A1","A2","B1","B2","C1"].map(x=>`<button class="level ${o.selfAssessment===x?"selected":""}" onclick="pick('selfAssessment','${x}')">${x}</button>`).join("")}</div><div class="grid3" style="margin-top:12px"><span class="small muted">I’m just starting.</span><span class="small muted">Simple everyday English.</span><span class="small muted">Familiar academic topics.</span></div>`;if(step===4)return`<h2>What can you realistically give each day?</h2><div class="form"><div class="field"><label>Available daily time</label><div class="choice-grid">${[15,30,45,60].map(x=>`<button class="choice ${o.dailyMinutes===x?"selected":""}" onclick="pick('dailyMinutes',${x})">${x} minutes</button>`).join("")}</div></div><div class="field"><label>Preferred session length</label><div class="choice-grid">${[15,25,40].map(x=>`<button class="choice ${o.sessionLength===x?"selected":""}" onclick="pick('sessionLength',${x})">${x} minutes</button>`).join("")}</div></div><div class="field"><label>Learning intensity</label><div class="choice-grid">${["Gentle","Balanced","Focused"].map(x=>`<button class="choice ${o.intensity===x?"selected":""}" onclick="pick('intensity','${x}')">${x}</button>`).join("")}</div></div></div>`;return`<div style="text-align:center"><div class="mark" style="margin:0 auto 14px;width:62px;height:62px"><i class="fa-solid fa-bullseye"></i></div><h2>A short diagnostic, then a clearer plan.</h2><p class="lead">We’ll use a short diagnostic assessment to understand your current English ability and create a learning plan around you.</p><div style="background:linear-gradient(135deg,#eff6ff,#faf5ff);padding:16px;border-radius:14px;text-align:left"><p>✓ It is not an official IELTS test.</p><p>✓ It creates an initial, provisional estimate.</p><p>✓ Answer independently so the evidence is useful.</p><p>✓ Later performance will refine your profile.</p></div></div>`}
function pick(k,v){const s=state();if(["ieltsType","targetBand","reason","englishVariant","explanationLanguage","selfAssessment","dailyMinutes","sessionLength","intensity"].includes(k))s.onboarding[k]=v;else s.user.studyContext=v;save(s);render()}
function pickContext(v){const s=state();s.user.studyContext=v;save(s);render()}
function skipDiagnostic(){const s=state();s.onboarding.complete=true;s.onboarding.step=6;s.diagnostic.status="skipped";s.diagnostic.currentSection=0;s.diagnostic.currentQuestion=0;save(s);nav("/dashboard")}
function onboardNext(step){const s=state();if(step===0){s.user.firstName=document.getElementById("obName").value.trim();s.user.ageGroup=document.getElementById("obAge").value;s.user.occupation=document.getElementById("obOcc").value;if(!s.user.firstName||!s.user.studyContext)return toast("Please complete your name and study context.")}if(step===1){s.onboarding.examDate=document.getElementById("obDate").value;if(!s.onboarding.examDate||!s.onboarding.reason)return toast("Please complete your IELTS goal details.")}if(step===2){if(!s.onboarding.englishVariant||!s.onboarding.explanationLanguage)return toast("Please choose both language settings.")}if(step===3&&!s.onboarding.selfAssessment)return toast("Please select a self-assessment level.");if(step<5){s.onboarding.step=step+1;save(s);render()}else{s.onboarding.complete=true;s.onboarding.step=6;save(s);nav("/diagnostic")}}
function onboardBack(step){if(step===0)return nav("/");const s=state();s.onboarding.step=step-1;save(s);render()}
function saveOnboard(step,exit){const s=state();s.onboarding.step=step;save(s);nav("/dashboard")}
function diagnostic(){const s=state();if(s.diagnostic.status==="not_started"){s.diagnostic.status="in_progress";save(s)}let sec=Math.min(6,s.diagnostic.currentSection||0);const cur=sections[sec],qi=s.diagnostic.currentQuestion||0;const totalEvidence=30,answered=Object.keys(s.diagnostic.responses).length+(s.diagnostic.writingText.trim()?1:0)+(s.diagnostic.speakingStatus==="SUBMITTED"?1:0);const prog=Math.round(answered/totalEvidence*100);return `<div class="diagnostic-page"><header class="diagnostic-top"><button class="brand" onclick="nav('/dashboard')"><span class="mark"><i class="fa-solid fa-graduation-cap"></i></span>AI IELTS Coach</button><span class="badge amber"><i class="fa-solid fa-lock"></i> TEST · AI assistance disabled</span><button class="save-link" onclick="diagSaveExit()">Save & exit</button></header><main style="width:min(1080px,calc(100% - 24px));margin:auto;padding:28px 0 60px">${header("DIAGNOSTIC ASSESSMENT","Let’s understand your current English.","Provisional evidence only. Nothing here is an official IELTS result.")}<div class="testbar"><span>${prog}% objective progress</span><span>${answered} / 30 evidence items</span></div><div class="tabs">${sections.map((x,i)=>`<button class="tab ${i===sec?"active":""}" onclick="diagJump(${i})">${s.diagnostic.completedSections.includes(x.id)?"✓ ":""}${x.name}</button>`).join("")}</div><div class="card" style="padding:20px">${diagBody(cur,qi,s)}<div class="onboard-actions"><button class="btn secondary" onclick="diagBack(${sec},${qi})"><i class="fa-solid fa-arrow-left"></i> Back</button><button class="btn primary" onclick="diagContinue(${sec},${qi})">${cur.kind==="objective"&&qi<cur.qs.length-1?"Next":"Continue"} <i class="fa-solid fa-arrow-right"></i></button></div></div></main></div>`}
function diagBody(cur,qi,s){if(cur.kind==="objective"){const q=cur.qs[qi];return`<div><div class="question-head"><div><div class="eyebrow">${cur.name}</div><h2>Question ${qi+1} of ${cur.qs.length}</h2></div><span class="badge gray">${q[4]}</span></div><p class="question">${q[1]}</p>${q[2].map((x,i)=>`<button class="option ${s.diagnostic.responses[q[0]]===i?"selected":""}" onclick="diagAnswer('${q[0]}',${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join("")}</div>`}if(cur.kind==="reading")return`<div class="reading-workspace"><article class="card passage-panel"><div class="eyebrow">READING PASSAGE</div><h2>Urban Green Spaces and City Life</h2><div class="passage-scroll">${passage.map(p=>`<p>${p}</p>`).join("")}</div></article><div class="question-panel"><div class="q-list">${cur.qs.map((q,i)=>`<div class="qblock"><div class="q">${i+1}. ${q[1]}</div>${q[2].map((x,j)=>`<button class="option ${s.diagnostic.responses[q[0]]===j?"selected":""}" onclick="diagAnswer('${q[0]}',${j})"><span class="letter">${String.fromCharCode(65+j)}</span>${x}</button>`).join("")}</div>`).join("")}</div></div></div>`;if(cur.kind==="listening")return`<div><div class="audio-box"><audio class="audio" controls src="listening-diagnostic.wav"></audio><p class="small muted"><i class="fa-solid fa-lock"></i> Transcript hidden during assessment.</p></div><div class="q-list" style="margin-top:14px">${cur.qs.map((q,i)=>`<div class="qblock"><div class="q">${i+1}. ${q[1]}</div>${q[2].map((x,j)=>`<button class="option ${s.diagnostic.responses[q[0]]===j?"selected":""}" onclick="diagAnswer('${q[0]}',${j})"><span class="letter">${String.fromCharCode(65+j)}</span>${x}</button>`).join("")}</div>`).join("")}</div></div>`;if(cur.kind==="writing")return`<div class="writing-workspace"><div class="card prompt-pane"><div class="eyebrow">WRITING · TASK 2</div><h2>Write your response independently.</h2><blockquote>${writingPrompt}</blockquote><div class="badge gray">Target 180–250 words</div><p class="small muted">No AI suggestions, rewriting, translation or feedback during the diagnostic.</p></div><div class="card" style="overflow:hidden"><div class="editor-top"><span>Your response</span><span><span id="diagWritingTimer">20:00</span> · <span id="diagWC">${wordCount(s.diagnostic.writingText)} words</span></span></div><textarea id="diagWriting" class="editor" placeholder="Begin writing here..." oninput="diagWritingSave(this.value)">${esc(s.diagnostic.writingText)}</textarea><div class="editor-bottom"><span class="small muted"><i class="fa-solid fa-check"></i> Saved locally</span></div></div></div>`;return speakingDiag(s)}
function speakingDiag(s){return`<div class="speaking-card"><div class="badge ${s.diagnostic.speakingStatus==="RECORDING"?"amber":"gray"}">${s.diagnostic.speakingStatus}</div><div class="cue"><div class="eyebrow">SPEAKING · PART 2</div><h2>Describe a skill you would like to learn in the future.</h2><ul>${speakingBullets.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="timer" id="diagSpeakTimer">${s.diagnostic.speakingStatus==="READY"?"1:00":s.diagnostic.speakingStatus==="SUBMITTED"?"Submitted":"Recording"}</div><p class="muted">Preparation 1 minute · response up to 2 minutes</p><div id="diagSpeakAction">${s.diagnostic.speakingStatus==="READY"?`<button class="btn primary" onclick="diagSpeakStart()">Start speaking task <i class="fa-solid fa-microphone"></i></button>`:s.diagnostic.speakingStatus==="SUBMITTED"?`<span class="badge green">Recording state saved</span>`:`<button class="btn primary" onclick="diagSpeakSubmit()">Submit response <i class="fa-solid fa-paper-plane"></i></button>`}</div></div>`}
function startDiagWritingTimer(){if(window._diagWritingInt)return;let left=1200;window._diagWritingInt=setInterval(()=>{left--;const e=document.getElementById("diagWritingTimer");if(e)e.textContent=`${String(Math.floor(Math.max(left,0)/60)).padStart(2,"0")}:${String(Math.max(left,0)%60).padStart(2,"0")}`;if(left<=0){clearInterval(window._diagWritingInt);window._diagWritingInt=null}},1000)}
function diagAnswer(id,i){const s=state();s.diagnostic.responses[id]=i;s.diagnostic.status="in_progress";save(s);render()}
function diagWritingSave(v){const s=state();s.diagnostic.writingText=v;save(s);const wc=document.getElementById("diagWC");if(wc)wc.textContent=wordCount(v)+" words"}
function diagJump(i){const s=state();if(i>s.diagnostic.currentSection && !s.diagnostic.completedSections.includes(sections[i].id))return toast("Complete the earlier section first.");s.diagnostic.currentSection=i;s.diagnostic.currentQuestion=0;save(s);render()}
function diagBack(sec,qi){const s=state();if(qi>0){s.diagnostic.currentQuestion=qi-1;save(s);return render()}if(sec>0){s.diagnostic.currentSection=sec-1;s.diagnostic.currentQuestion=0;save(s);return render()}nav("/dashboard")}
function diagContinue(sec,qi){const cur=sections[sec],s=state();if(cur.kind==="objective"&&qi<cur.qs.length-1){s.diagnostic.currentQuestion=qi+1;save(s);return render()}s.diagnostic.completedSections=[...new Set([...s.diagnostic.completedSections,cur.id])];if(sec<sections.length-1){s.diagnostic.currentSection=sec+1;s.diagnostic.currentQuestion=0;save(s);render()}else{finishDiagnostic()}}
function diagSpeakStart(){const s=state();s.diagnostic.speakingStatus="RECORDING";s.diagnostic.speakingDuration=0;save(s);render();let sec=0;const int=setInterval(()=>{sec++;const e=document.getElementById("diagSpeakTimer");if(e)e.textContent=`${Math.max(0,120-sec)}s`;const st=state();st.diagnostic.speakingDuration=sec;save(st);if(sec>=120){clearInterval(int);st.diagnostic.speakingStatus="SUBMITTED";save(st);render()}},1000)}
function diagSpeakSubmit(){const s=state();s.diagnostic.speakingStatus="SUBMITTED";s.diagnostic.speakingDuration=Math.max(1,s.diagnostic.speakingDuration||45);save(s);render()}
function diagSaveExit(){nav("/dashboard")}
function finishDiagnostic(){const s=state();s.diagnostic.status="processing";save(s);document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#f8fafc"><div class="card" style="width:min(560px,calc(100% - 28px));padding:30px;text-align:center"><div class="mark" style="margin:0 auto 14px;width:58px;height:58px"><i class="fa-solid fa-sparkles"></i></div><div class="eyebrow">ASSESSMENT PROCESSING</div><h1 style="font-size:28px;margin:8px 0">Analyzing your assessment...</h1><p class="muted" style="margin:0 0 20px">We’re combining the evidence you submitted into a provisional learner profile.</p><div style="display:grid;gap:9px;text-align:left">${["Grammar","Vocabulary","Reading","Writing","Listening","Speaking","IELTS Familiarity"].map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 12px;background:var(--slate-50);border-radius:10px"><span>${x}</span><span style="color:var(--emerald-600);font-weight:800">✓ Evidence received</span></div>`).join("")}</div></div></div>`;setTimeout(()=>finishDiagnosticCompute(),900)}
function finishDiagnosticCompute(){
 const s=state();
 const get=(id)=>{for(const sec of sections){const q=sec.qs?.find(x=>x[0]===id);if(q)return q;}};
 const pct=(qs)=>{if(!qs.length)return 0;let correct=0;for(const id of qs){const q=get(id);if(q && s.diagnostic.responses[id]===q[3])correct++;}return Math.round(correct/qs.length*100);};
 const g=pct(sections[0].qs.map(q=>q[0]));
 const v=pct(sections[1].qs.map(q=>q[0]));
 const r=pct(sections[2].qs.map(q=>q[0]));
 const l=pct(sections[3].qs.map(q=>q[0]));
 const f=pct(sections[6].qs.map(q=>q[0]));
 const wc=wordCount(s.diagnostic.writingText||"");
 const wp=Math.min(100,Math.round(Math.min(76,wc/180*76)+(s.diagnostic.writingText.includes(".")?12:0)+(s.diagnostic.writingText.length>550?8:0)));
 const sp=s.diagnostic.speakingStatus==="SUBMITTED"?Math.min(100,55+Math.round(Math.min(45,(s.diagnostic.speakingDuration||0)/3))):0;
 const band=(p)=>Math.max(3.5,Math.min(8.5,Math.round((4+p/20)*2)/2));
 const modules={
   Reading:{band:band(r),confidence:r>=70?"High":r>=50?"Medium":"Low",evidencePercent:r},
   Writing:{band:band(wp),confidence:wp>=70?"High":wp>=50?"Medium":"Low",evidencePercent:wp},
   Listening:{band:band(l),confidence:l>=70?"High":l>=50?"Medium":"Low",evidencePercent:l},
   Speaking:{band:band(sp),confidence:sp>=70?"High":sp>=50?"Medium":"Low",evidencePercent:sp}
 };
 const overall=Math.round(((modules.Reading.band+modules.Writing.band+modules.Listening.band+modules.Speaking.band)/4)*2)/2;
 const weighted=(g+v+r+l+wp+sp)/6;
 const cefr=weighted>=85?"C1":weighted>=70?"B2":weighted>=55?"B1":weighted>=40?"A2":"A1";
 const skills=[["Grammar",g],["Vocabulary",v],["Reading",r],["Writing",wp],["Listening",l],["Speaking",sp]].sort((a,b)=>b[1]-a[1]);
 const priorities=skills.slice(-3).reverse().map(x=>x[0]);
 const skillVal={Reading:r,Writing:wp,Listening:l,Speaking:sp,Grammar:g,Vocabulary:v};
 const results={
   cefr,
   moduleScores:modules,
   overall,
   overallConfidence:weighted>=70?"High":weighted>=50?"Medium":"Low",
   skillMastery:{Grammar:g,Vocabulary:v,Reading:r,Writing:wp,Listening:l,Speaking:sp,"IELTS Familiarity":f},
   familiarity:f,
   strengths:skills.slice(0,2).map(x=>x[0]+" fundamentals"),
   weaknesses:priorities.map(x=>x+": "+(skillVal[x]<50?"needs focused practice":"priority for refinement")),
   recurringWeaknesses:priorities.slice(0,2).map(x=>x+" question types require repeated practice."),
   priorities,
   readiness:overall>=7.5?"Exam Ready":overall>=6.5?"IELTS Practice":overall>=5?"Pre-IELTS":"Foundation",
   plan:priorities.slice(0,4).map((x,i)=>({
     title:x==="Reading"?"Reading inference drills":x==="Listening"?"Listening detail practice":x==="Speaking"?"2-minute speaking fluency":"Academic vocabulary review",
     reason:"Your diagnostic evidence places "+x.toLowerCase()+" among the highest-impact areas.",
     duration:(10+i*3)+" min",
     kind:i===0?"Priority":"Supporting"
   })),
   generatedAt:new Date().toISOString()
 };
 s.results=results;
 s.diagnostic.status="complete";
 save(s);
 nav("/diagnostic/results");
}
function results(){const s=state();if(!s.results)return workspace("No diagnostic results yet","Complete the diagnostic before opening the provisional profile.");const r=s.results;return `<div class="content">${header("DIAGNOSTIC RESULTS","Here is what we currently know about you.","Initial estimates based on limited evidence. They will become more accurate as you learn and practise.",`<button class="btn primary" onclick="nav('/dashboard')">Open dashboard <i class="fa-solid fa-arrow-right"></i></button>`)}<div class="personal-hero"><div><span class="badge purple">PROVISIONAL</span><div style="font-size:50px;font-weight:800;line-height:1;margin:8px 0">${r.overall}</div><div class="muted">Estimated overall IELTS</div></div><div class="grid3" style="grid-template-columns:repeat(4,1fr)">${[['CEFR',r.cefr],['Confidence',r.overallConfidence],['IELTS familiarity',r.familiarity+'%'],['Readiness',r.readiness]].map(x=>`<div class="card" style="padding:12px"><span class="small muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div></div><div class="score-grid">${Object.entries(r.moduleScores).map(([n,m])=>`<div class="card score-card"><span class="small muted">${n}</span><strong>${m.band}</strong><span class="badge ${m.confidence==="High"?"green":m.confidence==="Medium"?"amber":"gray"}">${m.confidence} confidence</span></div>`).join("")}</div><div class="grid2" style="margin-top:16px"><div class="card" style="padding:20px"><div class="card-title"><span>Skill evidence</span></div>${Object.entries(r.skillMastery).map(([k,v])=>`<div class="analysis"><span>${k}</span><strong>${v}%</strong><div class="progress"><span style="width:${v}%"></span></div></div>`).join("")}</div><div class="card" style="padding:20px"><div class="card-title"><span>Strengths & priorities</span></div><h4>Top strengths</h4>${r.strengths.map(x=>`<p><i class="fa-solid fa-check" style="color:var(--emerald-600)"></i> ${x}</p>`).join("")}<h4>Priority skills</h4>${r.priorities.map(x=>`<p><i class="fa-solid fa-arrow-right" style="color:var(--brand-600)"></i> ${x}</p>`).join("")}</div></div><div class="card" style="padding:20px;margin-top:16px"><div class="card-title"><span>Personalized starting plan</span><span class="badge blue">WHY THESE ACTIONS?</span></div>${r.plan.map((x,i)=>`<div class="profile-row"><strong>0${i+1}</strong><span><strong>${x.title}</strong><br>${x.reason}</span><span>${x.duration}</span></div>`).join("")}</div><div class="notice" style="margin-top:16px;padding:12px;border-radius:12px;background:var(--slate-50);border:1px solid var(--slate-100);font-size:11px;color:var(--slate-600)">These are initial estimates based on limited diagnostic evidence. Your profile will become more accurate as you complete more learning and practice activities.</div></div>`}
function toggleAI(){let p=document.getElementById("aiPanel");if(!p)return; if(p.style.display==="none"){p.style.display="flex";p.innerHTML=`<div class="ai-head"><div><strong>AI Coach</strong><span>Contextual assistant</span></div><button onclick="toggleAI()">×</button></div><div id="aiMessages" class="ai-messages"><div class="bubble ai">I’m ready to help with your current learning task. In this prototype, responses are simulated.</div></div><div class="ai-input"><input id="aiInput" placeholder="Ask about this task..." onkeydown="if(event.key==='Enter')aiSend()"><button onclick="aiSend()"><i class="fa-solid fa-paper-plane"></i></button></div><div class="ai-footer">Prototype simulation · future RAG / LLM boundary</div>`}else p.style.display="none"}
function aiSend(){const i=document.getElementById("aiInput"),m=document.getElementById("aiMessages");if(!i?.value.trim())return;const q=esc(i.value.trim());m.innerHTML+=`<div class="bubble user">${q}</div><div class="bubble ai">Prototype guidance: tie the next action to your current learning priority, then review the evidence from the attempt.</div>`;i.value=""}
function openEditProfile(){const s=state();document.body.insertAdjacentHTML("beforeend",`<div id="modal" class="overlay"><div class="modal"><div class="modal-head"><div><div class="eyebrow">PROFILE</div><h2>Edit your goals & preferences</h2></div><button onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>First name</label><input id="eName" class="input" value="${esc(s.user.firstName)}"></div><div class="grid2"><div class="field"><label>Target band</label><select id="eBand" class="select">${[5,5.5,6,6.5,7,7.5,8,8.5,9].map(x=>`<option ${s.onboarding.targetBand===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Exam date</label><input id="eDate" type="date" class="input" value="${s.onboarding.examDate}"></div></div><div class="field"><label>English variety</label><div class="choice-grid"><button class="choice ${s.onboarding.englishVariant==="UK"?"selected":""}" onclick="editPick('UK')">🇬🇧 UK English</button><button class="choice ${s.onboarding.englishVariant==="US"?"selected":""}" onclick="editPick('US')">🇺🇸 US English</button></div></div><div class="field"><label>Explanation language</label><div class="choice-grid">${["English","Uzbek","English + Uzbek"].map(x=>`<button class="choice ${s.onboarding.explanationLanguage===x?"selected":""}" onclick="editLang('${x}')">${x}</button>`).join("")}</div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEdit()">Save changes</button></div></div></div></div>`)}
function editPick(v){const s=state();s.onboarding.englishVariant=v;save(s);openEditProfile();closeModal()}
function editLang(v){const s=state();s.onboarding.explanationLanguage=v;save(s);openEditProfile();closeModal()}
function saveEdit(){const s=state();s.user.firstName=document.getElementById("eName").value.trim()||"Student";s.onboarding.targetBand=Number(document.getElementById("eBand").value);s.onboarding.examDate=document.getElementById("eDate").value;save(s);closeModal();toast("Profile updated");render()}
function closeModal(){document.getElementById("modal")?.remove()}
function resetDemo(){localStorage.clear();toast("Demo state reset");setTimeout(()=>nav("/"),300)}
function bind(){window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{render()});
window.addEventListener("storage",()=>render());
render();
</script>
</body>
</html>
